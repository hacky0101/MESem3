<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Hyperlinks Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f5f5f5;
            color: #333;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        .link-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        a {
            color: #007bff;
            text-decoration: none;
            font-weight: 500;
        }
        a:hover {
            text-decoration: underline;
            color: #0056b3;
        }
        ul {
            line-height: 1.8;
        }
        .note {
            font-size: 14px;
            color: #666;
            margin-top: 30px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>FREE COURSES</h1>

    <div class="link-box">
        <ul>

   



            <li><a href="https://rarestudy.in/#apps" target="_blank">https://rarestudy.in/#apps</a></li>
            <li><a href="https://streamfiles.eu.org/" target="_blank">https://streamfiles.eu.org/</a></li>
            <li><a href="https://pw4free.in" target="_blank">https://pw4free.in</a></li>
            <li><a href="https://lite.pw4free.in/" target="_blank">https://lite.pw4free.in/</a></li>
            <li><a href="https://muftukmall.in/" target="_blank">https://muftukmall.in/</a></li>
            <li><a href="https://pw.studyparcham.in/" target="_blank">https://pw.studyparcham.in/</a></li>
            <li><a href="https://studypanda.live/" target="_blank">https://studypanda.live/</a></li>
            <li><a href="https://primestudy.live/" target="_blank">https://primestudy.live/</a></li>
              <li><a href="https://s4-cdn.samfygros.com" target="_blank">https://s4-cdn.samfygros.com</a></li>
            
        </ul>
    </div>

  
</body>
</html>
