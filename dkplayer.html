<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Video Player</title>
  <script src="https://www.gstatic.com/cast/sdk/castsdk.js"></script>
  <!-- HLS.js for M3U8 support -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    :root {
      --bg-color: #e0e5ec;
      --text-color: #333333;
      --card-bg: #e0e5ec;
      --primary-color: #007bff;
      --shadow-light: 8px 8px 16px #b8bec7, -8px -8px 16px #ffffff;
      --shadow-dark: 5px 5px 10px #b8bec7, -5px -5px 10px #ffffff;
      --shadow-inset: inset 5px 5px 10px #b8bec7, inset -5px -5px 10px #ffffff;
      --border-color: #e0e5ec;
    }

    [data-theme="dark"] {
      --bg-color: #2c2e33;
      --text-color: #d1d5db;
      --card-bg: #2c2e33;
      --primary-color: #66b0ff;
      --shadow-light: 8px 8px 16px #1f2124, -8px -8px 16px #3b3e44;
      --shadow-dark: 5px 5px 10px #1f2124, -5px -5px 10px #3b3e44;
      --shadow-inset: inset 5px 5px 10px #1f2124, inset -5px -5px 10px #3b3e44;
      --border-color: #444444;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Arial', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text-color);
    }

    .video-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: var(--shadow-light);
    }

    video {
      width: 100%;
      display: block;
      transform-origin: center center;
      object-fit: contain;
      border-radius: 20px;
    }

    /* YouTube/GDrive iframe styling */
    #youtubePlayer {
      width: 100%;
      height: 450px;
      display: none;
      border: none;
      border-radius: 20px;
    }

    /* Mode indicator badge */
    .mode-indicator {
      position: absolute;
      top: 15px;
      right: 15px;
      background: var(--primary-color);
      color: white;
      padding: 6px 12px;
      border-radius: 15px;
      font-size: 11px;
      font-weight: bold;
      box-shadow: var(--shadow-dark);
      z-index: 15;
      text-transform: uppercase;
    }

    .error-message {
      color: var(--text-color);
      font-size: 1.2rem;
      text-align: center;
      margin-top: 1rem;
    }

    .controls {
      position: absolute;
      bottom: 20px;
      width: 90%;
      left: 5%;
      background: var(--card-bg);
      padding: 8px;
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transition: opacity 0.3s ease;
      box-shadow: var(--shadow-light);
      z-index: 10;
      flex-wrap: wrap;
    }

    .video-container.active .controls {
      opacity: 1;
    }

    .control-btn {
      width: 50px;
      height: 50px;
      background: var(--card-bg);
      border: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: var(--shadow-dark);
      font-size: 20px;
      color: var(--primary-color);
    }

    .control-btn i {
      font-size: 18px;
    }

    .control-btn:hover {
      box-shadow: var(--shadow-inset);
      transform: translateY(-2px);
    }

    .control-btn:active {
      transform: scale(0.95);
      box-shadow: var(--shadow-inset);
    }

    .controls select,
    .controls input[type="range"],
    .controls input[type="text"] {
      padding: 6px;
      border: none;
      border-radius: 20px;
      background: var(--card-bg);
      color: var(--text-color);
      font-size: 12px;
      cursor: pointer;
      box-shadow: var(--shadow-inset);
    }

    .controls select:hover,
    .controls input[type="text"]:hover {
      box-shadow: var(--shadow-dark);
    }

    .controls input[type="range"] {
      width: 80px;
      accent-color: var(--primary-color);
    }

    /* Hidden file input */
    #localFileInput {
      display: none;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: var(--card-bg);
      position: absolute;
      top: 0;
      left: 0;
      cursor: pointer;
      border-radius: 20px;
      box-shadow: var(--shadow-inset);
    }

    .progress {
      height: 100%;
      background: var(--primary-color);
      width: 0;
      border-radius: 20px;
      transition: width 0.1s linear;
    }

    .time,
    #castStatus {
      font-size: 12px;
      color: var(--text-color);
      margin: 0 10px;
      align-self: center;
    }

    #videoUrl {
      flex: 1;
      background: var(--card-bg);
      color: var(--text-color);
      border: none;
      box-shadow: var(--shadow-inset);
      min-width: 150px;
    }

    #videoUrl:focus {
      outline: none;
      box-shadow: var(--shadow-dark);
    }

    /* Mobile responsive adjustments */
    @media (max-width: 768px) {
      .controls {
        gap: 6px;
        padding: 6px;
      }

      .control-btn {
        width: 40px;
        height: 40px;
      }

      .control-btn i {
        font-size: 14px;
      }

      #youtubePlayer {
        height: 300px;
      }

      .time {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>
  <div class="video-container" id="videoContainer">
    <!-- Mode indicator -->
    <div class="mode-indicator" id="modeIndicator">MP4</div>

    <!-- Video element -->
    <video id="videoPlayer" controls crossorigin="anonymous">
      <source id="video-source" src="" type="video/mp4">
      Your browser does not support the video tag.
    </video>

    <!-- YouTube/GDrive iframe (hidden by default) -->
    <iframe id="youtubePlayer" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>

    <div class="progress-bar">
      <div class="progress"></div>
    </div>
    <p id="error-message" class="error-message" style="display: none;">Video load error: Please check the URL or try again later.</p>

    <div class="controls">
      <button class="control-btn" onclick="togglePlay()" title="Play/Pause">
        <i class="fas fa-play" id="playIcon"></i>
      </button>
      <button class="control-btn" onclick="rewind()" title="Rewind">
        <i class="fas fa-backward"></i>
      </button>
      <button class="control-btn" onclick="fastForward()" title="Fast Forward">
        <i class="fas fa-forward"></i>
      </button>
      <input type="range" id="volume" min="0" max="1" step="0.1" value="1" title="Volume">
      <select id="playbackSpeed" onchange="changeSpeed()" title="Playback Speed">
        <option value="0.5">0.5x</option>
        <option value="1" selected>1x</option>
        <option value="1.5">1.5x</option>
        <option value="2">2x</option>
        <option value="3">3x</option>
        <option value="4">4x</option>
        <option value="5">5x</option>
      </select>
      <span class="time" id="currentTime">0:00</span> / <span class="time" id="duration">0:00</span>
      <button class="control-btn" onclick="enterPiP()" title="Picture-in-Picture">
        <i class="fas fa-tv"></i>
      </button>
      <button class="control-btn" onclick="toggleFullScreen()" title="Full Screen">
        <i class="fas fa-expand"></i>
      </button>
      <button class="control-btn" id="castButton" onclick="toggleCast()" title="Cast">
        <i class="fas fa-wifi"></i>
      </button>
      <span id="castStatus">Disconnected</span>

      <!-- Local file picker button -->
      <button class="control-btn" onclick="document.getElementById('localFileInput').click()" title="Pick from Phone">
        <i class="fas fa-folder-open"></i>
      </button>
      <input type="file" id="localFileInput" accept="video/*" onchange="handleLocalFile(event)">

      <input type="text" id="videoUrl" placeholder="Enter video URL">
      <button class="control-btn" onclick="loadVideo()" title="Load Video">
        <i class="fas fa-upload"></i>
      </button>
    </div>
  </div>

  <script>
    // Global variables
    const video = document.getElementById('videoPlayer');
    const youtubePlayer = document.getElementById('youtubePlayer');
    const videoSource = document.getElementById('video-source');
    const videoContainer = document.getElementById('videoContainer');
    const progressBar = document.querySelector('.progress-bar');
    const progress = document.querySelector('.progress');
    const currentTimeDisplay = document.getElementById('currentTime');
    const durationDisplay = document.getElementById('duration');
    const volumeControl = document.getElementById('volume');
    const playIcon = document.getElementById('playIcon');
    const errorMessage = document.getElementById('error-message');
    const castStatus = document.getElementById('castStatus');
    const modeIndicator = document.getElementById('modeIndicator');

    let castSession = null;
    let zoomLevel = 1;
    let translateX = 0;
    let translateY = 0;
    let isDragging = false;
    let startX = 0;
    let startY = 0;
    let initialDistance = 0;
    let hls = null; // HLS.js instance
    let currentMode = 'MP4'; // Current playback mode

    // Show controls on interaction
    videoContainer.addEventListener('mouseenter', () => {
      videoContainer.classList.add('active');
    });
    videoContainer.addEventListener('mouseleave', () => {
      videoContainer.classList.remove('active');
    });
    videoContainer.addEventListener('touchstart', () => {
      videoContainer.classList.add('active');
      setTimeout(() => videoContainer.classList.remove('active'), 3000);
    });

    videoContainer.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        initialDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
      } else if (e.touches.length === 1 && zoomLevel > 1) {
        isDragging = true;
        startX = e.touches[0].clientX - translateX;
        startY = e.touches[0].clientY - translateY;
      }
    });

    // Initialize Chromecast
    window['__onGCastApiAvailable'] = function (isAvailable) {
      if (isAvailable) {
        cast.framework.CastContext.getInstance().setOptions({
          receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
          autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
        });

        cast.framework.CastContext.getInstance().addEventListener(
          cast.framework.CastContextEventType.SESSION_STATE_CHANGED,
          (event) => {
            if (event.sessionState === cast.framework.SessionState.SESSION_STARTED) {
              castSession = cast.framework.CastContext.getInstance().getCurrentSession();
              castStatus.textContent = 'Connected';
              if (videoSource.src) {
                loadMediaOnCast();
              }
            } else if (event.sessionState === cast.framework.SessionState.SESSION_ENDED) {
              castStatus.textContent = 'Disconnected';
              castSession = null;
              video.play();
            }
          }
        );
      }
    }

    function loadMediaOnCast() {
      if (!castSession) return;
      const mediaInfo = new chrome.cast.media.MediaInfo(videoSource.src, 'video/mp4');
      mediaInfo.metadata = new chrome.cast.media.GenericMediaMetadata();
      mediaInfo.metadata.title = 'Video Player';
      const request = new chrome.cast.media.LoadRequest(mediaInfo);
      request.currentTime = video.currentTime;
      castSession.loadMedia(request).then(
        () => {
          video.pause();
        },
        (error) => {
          console.error('Cast load error:', error);
          castStatus.textContent = 'Cast Error';
        }
      );
    }

    function toggleCast() {
      const castContext = cast.framework.CastContext.getInstance();
      if (castContext.getCastState() === cast.framework.CastState.CONNECTED) {
        castContext.endCurrentSession(true);
      } else {
        castContext.requestSession();
      }
    }

    function togglePlay() {
      if (currentMode === 'YOUTUBE' || currentMode === 'GDRIVE-IFRAME') {
        // YouTube/GDrive iframe doesn't support programmatic play/pause
        return;
      }

      if (castSession) {
        const media = castSession.getMediaSession();
        if (media) {
          if (media.playerState === chrome.cast.media.PlayerState.PLAYING) {
            media.pause(null);
            playIcon.classList.remove('fa-pause');
            playIcon.classList.add('fa-play');
          } else {
            media.play(null);
            playIcon.classList.remove('fa-play');
            playIcon.classList.add('fa-pause');
          }
        }
      } else {
        if (video.paused) {
          video.play();
          playIcon.classList.remove('fa-play');
          playIcon.classList.add('fa-pause');
        } else {
          video.pause();
          playIcon.classList.remove('fa-pause');
          playIcon.classList.add('fa-play');
        }
      }
    }

    function rewind() {
      if (currentMode === 'YOUTUBE' || currentMode === 'GDRIVE-IFRAME') return;
      video.currentTime = Math.max(0, video.currentTime - 10);
      if (castSession) {
        const media = castSession.getMediaSession();
        if (media) {
          media.seek({ currentTime: video.currentTime });
        }
      }
    }

    function fastForward() {
      if (currentMode === 'YOUTUBE' || currentMode === 'GDRIVE-IFRAME') return;
      video.currentTime = Math.min(video.duration, video.currentTime + 10);
      if (castSession) {
        const media = castSession.getMediaSession();
        if (media) {
          media.seek({ currentTime: video.currentTime });
        }
      }
    }

    volumeControl.addEventListener('input', () => {
      if (currentMode === 'YOUTUBE' || currentMode === 'GDRIVE-IFRAME') return;
      video.volume = volumeControl.value;
      if (castSession) {
        const media = castSession.getMediaSession();
        if (media) {
          castSession.setReceiverVolumeLevel(volumeControl.value);
        }
      }
    });

    function changeSpeed() {
      if (currentMode === 'YOUTUBE' || currentMode === 'GDRIVE-IFRAME') return;
      const speed = parseFloat(document.getElementById('playbackSpeed').value);
      video.playbackRate = speed;
      if (castSession) {
        const media = castSession.getMediaSession();
        if (media) {
          media.setPlaybackRate(speed, null);
        }
      }
    }

    video.addEventListener('timeupdate', () => {
      if (!castSession && currentMode !== 'YOUTUBE' && currentMode !== 'GDRIVE-IFRAME') {
        const percent = (video.currentTime / video.duration) * 100;
        progress.style.width = `${percent}%`;
        currentTimeDisplay.textContent = formatTime(video.currentTime);
        durationDisplay.textContent = formatTime(video.duration);
      }
    });

    progressBar.addEventListener('click', (e) => {
      if (currentMode === 'YOUTUBE' || currentMode === 'GDRIVE-IFRAME') return;
      const rect = progressBar.getBoundingClientRect();
      const pos = (e.clientX - rect.left) / rect.width;
      video.currentTime = pos * video.duration;
      if (castSession) {
        const media = castSession.getMediaSession();
        if (media) {
          media.seek({
            currentTime: pos * video.duration
          });
        }
      }
    });

    function formatTime(seconds) {
      const minutes = Math.floor(seconds / 60);
      seconds = Math.floor(seconds % 60);
      return `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
    }

    async function enterPiP() {
      if (currentMode === 'YOUTUBE' || currentMode === 'GDRIVE-IFRAME') return;
      try {
        if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
        } else if (!castSession) {
          await video.requestPictureInPicture();
        }
      } catch (error) {
        console.error('PiP error:', error);
      }
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        videoContainer.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    function updateTransform() {
      if (currentMode === 'YOUTUBE' || currentMode === 'GDRIVE-IFRAME') return;
      zoomLevel = Math.max(1, Math.min(zoomLevel, 3));
      const rect = video.getBoundingClientRect();
      const maxTranslateX = (rect.width * (zoomLevel - 1)) / 2;
      const maxTranslateY = (rect.height * (zoomLevel - 1)) / 2;
      translateX = Math.max(-maxTranslateX, Math.min(maxTranslateX, translateX));
      translateY = Math.max(-maxTranslateY, Math.min(maxTranslateY, translateY));
      video.style.transform = `scale(${zoomLevel}) translate(${translateX}px, ${translateY}px)`;
    }

    videoContainer.addEventListener('wheel', (e) => {
      if (currentMode === 'YOUTUBE' || currentMode === 'GDRIVE-IFRAME') return;
      e.preventDefault();
      const delta = e.deltaY > 0 ? -0.1 : 0.1;
      zoomLevel += delta;
      updateTransform();
    }, { passive: false });

    videoContainer.addEventListener('touchmove', (e) => {
      if (currentMode === 'YOUTUBE' || currentMode === 'GDRIVE-IFRAME') return;
      if (e.touches.length === 2) {
        e.preventDefault();
        const currentDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const scaleChange = currentDistance / initialDistance;
        zoomLevel *= scaleChange;
        initialDistance = currentDistance;
        updateTransform();
      } else if (e.touches.length === 1 && isDragging && zoomLevel > 1) {
        e.preventDefault();
        translateX = e.touches[0].clientX - startX;
        translateY = e.touches[0].clientY - startY;
        updateTransform();
      }
    });

    videoContainer.addEventListener('touchend', () => {
      isDragging = false;
    });

    videoContainer.addEventListener('mousedown', (e) => {
      if (currentMode === 'YOUTUBE' || currentMode === 'GDRIVE-IFRAME') return;
      if (zoomLevel > 1) {
        isDragging = true;
        startX = e.clientX - translateX;
        startY = e.clientY - translateY;
      }
    });

    videoContainer.addEventListener('mousemove', (e) => {
      if (currentMode === 'YOUTUBE' || currentMode === 'GDRIVE-IFRAME') return;
      if (isDragging && zoomLevel > 1) {
        translateX = e.clientX - startX;
        translateY = e.clientY - startY;
        updateTransform();
      }
    });

    videoContainer.addEventListener('mouseup', () => {
      isDragging = false;
    });

    videoContainer.addEventListener('mouseleave', () => {
      isDragging = false;
    });

    // ===== AUTO-DETECT & LOAD VIDEO FUNCTION =====
    function detectVideoType(url) {
      const urlLower = url.toLowerCase();

      // Google Drive detection
      if (urlLower.includes('drive.google.com') || urlLower.includes('docs.google.com')) {
        return 'GDRIVE';
      }

      // YouTube detection
      if (urlLower.includes('youtube.com') || urlLower.includes('youtu.be')) {
        return 'YOUTUBE';
      }

      // M3U8 (HLS) detection
      if (urlLower.includes('.m3u8')) {
        return 'M3U8';
      }

      // MP4 / WebM detection
      if (urlLower.includes('.mp4') || urlLower.includes('.webm')) {
        return 'MP4';
      }

      // Default to MP4 if no specific format detected
      return 'MP4';
    }

    function extractYouTubeID(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    function extractGDriveID(url) {
      // Google Drive URL patterns:
      // https://drive.google.com/file/d/FILE_ID/view
      // https://drive.google.com/open?id=FILE_ID
      // https://drive.google.com/uc?id=FILE_ID
      
      let fileID = null;
      
      // Pattern 1: /file/d/FILE_ID/
      const pattern1 = /\/file\/d\/([^\/\?]+)/;
      const match1 = url.match(pattern1);
      if (match1) {
        fileID = match1[1];
      }
      
      // Pattern 2: ?id=FILE_ID or &id=FILE_ID
      if (!fileID) {
        const pattern2 = /[?&]id=([^&]+)/;
        const match2 = url.match(pattern2);
        if (match2) {
          fileID = match2[1];
        }
      }
      
      return fileID;
    }

    function cleanupHLS() {
      if (hls) {
        hls.destroy();
        hls = null;
      }
    }

    function switchToVideoMode() {
      video.style.display = 'block';
      youtubePlayer.style.display = 'none';
    }

    function switchToYouTubeMode() {
      video.style.display = 'none';
      youtubePlayer.style.display = 'block';
    }

    async function loadGoogleDriveVideo(fileID, url) {
      // Method 1: Try direct download URL (works for small files)
      const directURL = `https://drive.google.com/uc?export=download&id=${fileID}`;
      
      // Method 2: Try preview URL (works better for larger files)
      const previewURL = `https://drive.google.com/file/d/${fileID}/preview`;
      
      // Method 3: Embedded iframe (fallback for all sizes)
      const embedURL = `https://drive.google.com/file/d/${fileID}/preview`;
      
      try {
        // First try: Direct video tag with download URL
        switchToVideoMode();
        currentMode = 'GDRIVE';
        modeIndicator.textContent = 'GDRIVE';
        
        videoSource.src = directURL;
        video.load();
        
        // If video doesn't load within 3 seconds, try iframe
        const loadTimeout = setTimeout(() => {
          console.log('Direct URL timeout, switching to iframe...');
          switchToYouTubeMode();
          currentMode = 'GDRIVE-IFRAME';
          modeIndicator.textContent = 'GDRIVE';
          youtubePlayer.src = embedURL;
        }, 3000);
        
        // If video loads successfully, clear the timeout
        video.addEventListener('loadeddata', () => {
          clearTimeout(loadTimeout);
          video.play();
          playIcon.classList.remove('fa-play');
          playIcon.classList.add('fa-pause');
        }, { once: true });
        
        // If video fails to load, use iframe
        video.addEventListener('error', () => {
          clearTimeout(loadTimeout);
          console.log('Direct URL failed, using iframe...');
          switchToYouTubeMode();
          currentMode = 'GDRIVE-IFRAME';
          modeIndicator.textContent = 'GDRIVE';
          youtubePlayer.src = embedURL;
        }, { once: true });
        
      } catch (error) {
        // Final fallback: iframe embed
        switchToYouTubeMode();
        currentMode = 'GDRIVE-IFRAME';
        modeIndicator.textContent = 'GDRIVE';
        youtubePlayer.src = embedURL;
      }
    }

    function loadVideo() {
      const url = document.getElementById('videoUrl').value.trim();
      if (!url) return;

      try {
        // Clean up previous instances
        cleanupHLS();

        // Detect video type
        const type = detectVideoType(url);

        // Reset zoom and transform
        zoomLevel = 1;
        translateX = 0;
        translateY = 0;
        updateTransform();

        // Hide error message
        if (errorMessage) errorMessage.style.display = 'none';

        if (type === 'GDRIVE') {
          // Google Drive mode with multiple fallback methods
          const fileID = extractGDriveID(url);
          if (fileID) {
            loadGoogleDriveVideo(fileID, url);
          } else {
            throw new Error('Invalid Google Drive URL');
          }
        } else if (type === 'YOUTUBE') {
          // YouTube mode
          currentMode = 'YOUTUBE';
          modeIndicator.textContent = 'YOUTUBE';
          const videoID = extractYouTubeID(url);
          if (videoID) {
            switchToYouTubeMode();
            youtubePlayer.src = `https://www.youtube.com/embed/${videoID}?autoplay=1`;
          } else {
            throw new Error('Invalid YouTube URL');
          }
        } else if (type === 'M3U8') {
          // HLS mode
          currentMode = 'M3U8';
          modeIndicator.textContent = 'M3U8';
          switchToVideoMode();
          if (Hls.isSupported()) {
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
              video.play();
              playIcon.classList.remove('fa-play');
              playIcon.classList.add('fa-pause');
            });
          } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            // Safari native HLS support
            videoSource.src = url;
            video.load();
            video.play();
            playIcon.classList.remove('fa-play');
            playIcon.classList.add('fa-pause');
          } else {
            throw new Error('HLS not supported in this browser');
          }
        } else {
          // MP4 / WebM mode
          currentMode = 'MP4';
          modeIndicator.textContent = 'MP4';
          switchToVideoMode();
          videoSource.src = url;
          video.load();
          video.play();
          playIcon.classList.remove('fa-play');
          playIcon.classList.add('fa-pause');

          if (castSession) {
            loadMediaOnCast();
          }
        }
      } catch (error) {
        if (errorMessage) errorMessage.style.display = 'block';
        console.error('Load video error:', error);
      }
    }

    // ===== LOCAL FILE HANDLING =====
    function handleLocalFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      try {
        // Clean up previous instances
        cleanupHLS();

        // Create blob URL
        const blobURL = URL.createObjectURL(file);

        // Set mode
        currentMode = 'LOCAL';
        modeIndicator.textContent = 'LOCAL';

        // Switch to video mode
        switchToVideoMode();

        // Load the local file
        videoSource.src = blobURL;
        video.load();
        video.play();

        // Reset zoom
        zoomLevel = 1;
        translateX = 0;
        translateY = 0;
        updateTransform();

        // Update UI
        playIcon.classList.remove('fa-play');
        playIcon.classList.add('fa-pause');
        if (errorMessage) errorMessage.style.display = 'none';

      } catch (error) {
        if (errorMessage) errorMessage.style.display = 'block';
        console.error('Local file error:', error);
      }
    }

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (currentMode === 'YOUTUBE' || currentMode === 'GDRIVE-IFRAME') return;

      switch (e.key) {
        case ' ':
          e.preventDefault();
          togglePlay();
          break;
        case 'ArrowRight':
          fastForward();
          break;
        case 'ArrowLeft':
          rewind();
          break;
        case 'ArrowUp':
          e.preventDefault();
          video.volume = Math.min(video.volume + 0.1, 1);
          volumeControl.value = video.volume;
          if (castSession) {
            castSession.setReceiverVolumeLevel(video.volume);
          }
          break;
        case 'ArrowDown':
          e.preventDefault();
          video.volume = Math.max(video.volume - 0.1, 0);
          volumeControl.value = video.volume;
          if (castSession) {
            castSession.setReceiverVolumeLevel(video.volume);
          }
          break;
      }
    });

    video.setAttribute('playsinline', '');
    // Auto-load from ?url= parameter
const urlParams = new URLSearchParams(window.location.search);
const autoUrl = urlParams.get('url');
if (autoUrl) {
  document.getElementById('videoUrl').value = autoUrl;
  loadVideo();
}
  </script>
