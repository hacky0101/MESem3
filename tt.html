<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>II SEM B.TECH Timetable</title>
    <style>
      * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --navy: #0f172a;
    --navy-light: #172554;

    --blue: #2563eb;
    --blue-light: #3b82f6;
    --purple: #7c3aed;
    --cyan: #06b6d4;

    --green: #16a34a;
    --orange: #f97316;
    --red: #ef4444;

    --text: #1e293b;
    --muted: #64748b;

    --bg: #f1f5f9;
    --white: #ffffff;
    --border: #e2e8f0;

    --shadow: 0 8px 25px rgba(15, 23, 42, 0.08);
    --shadow-hover: 0 14px 35px rgba(15, 23, 42, 0.14);
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background:
        radial-gradient(circle at 10% 10%, rgba(37, 99, 235, 0.12), transparent 28%),
        radial-gradient(circle at 90% 15%, rgba(124, 58, 237, 0.12), transparent 30%),
        linear-gradient(135deg, #f8fafc, #eef2ff);
    color: var(--text);
    min-height: 100vh;
}

/* =========================
   MAIN CONTAINER
========================= */

.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 22px;
}

/* =========================
   HEADER
========================= */

header {
    position: relative;
    overflow: hidden;

    background:
        linear-gradient(
            135deg,
            #020617 0%,
            #172554 45%,
            #1d4ed8 100%
        );

    padding: 32px 25px;
    border-radius: 20px;
    text-align: center;
    margin-bottom: 20px;

    box-shadow:
        0 15px 35px rgba(15, 23, 42, 0.22);

    border-bottom: 4px solid var(--cyan);
}

header::before {
    content: "";
    position: absolute;
    width: 220px;
    height: 220px;
    background: rgba(6, 182, 212, 0.12);
    border-radius: 50%;
    top: -120px;
    right: -60px;
}

header::after {
    content: "";
    position: absolute;
    width: 180px;
    height: 180px;
    background: rgba(124, 58, 237, 0.12);
    border-radius: 50%;
    bottom: -120px;
    left: -50px;
}

header h1,
header p {
    position: relative;
    z-index: 2;
}

header h1 {
    color: #ffffff;
    font-size: 2rem;
    font-weight: 800;
    margin-bottom: 10px;
    letter-spacing: 0.3px;
}

header p {
    color: #cbd5e1;
    margin: 6px 0;
    font-size: 14px;
}

header p strong {
    color: #ffffff;
}

/* =========================
   TABS
========================= */

.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.tab-btn {
    flex: 1;

    padding: 14px 18px;

    background: rgba(255, 255, 255, 0.9);
    border: 1px solid var(--border);
    border-radius: 13px;

    cursor: pointer;

    font-size: 15px;
    font-weight: 700;

    color: var(--muted);

    transition: all 0.25s ease;

    box-shadow: var(--shadow);
}

.tab-btn:hover {
    transform: translateY(-2px);
    border-color: #bfdbfe;
    box-shadow: var(--shadow-hover);
    color: var(--blue);
}

.tab-btn.active {
    color: #ffffff;
    border-color: transparent;

    background:
        linear-gradient(
            135deg,
            var(--blue),
            var(--purple)
        );

    box-shadow:
        0 8px 22px rgba(37, 99, 235, 0.25);
}

/* =========================
   TAB CONTENT
========================= */

.tab-content {
    display: none;
}

.tab-content.active {
    display: block;
    animation: fadeIn 0.25s ease;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(5px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* =========================
   CURRENT DATE
========================= */

.current-date {
    background: rgba(255, 255, 255, 0.95);

    padding: 16px 20px;

    border-radius: 14px;

    margin-bottom: 20px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    border: 1px solid var(--border);

    box-shadow: var(--shadow);
}

.current-date h3 {
    color: var(--navy);
    font-size: 17px;
}

.current-date h3 span {
    color: var(--blue);
}

.current-date > span {
    color: var(--muted);
    font-size: 14px;
}

/* =========================
   DAY SELECTOR
========================= */

.day-selector {
    display: flex;
    gap: 9px;
    flex-wrap: wrap;
    margin-bottom: 20px;
    justify-content: center;
}

.day-btn {
    padding: 11px 20px;

    background: #ffffff;

    border: 1px solid var(--border);
    border-radius: 10px;

    cursor: pointer;

    font-weight: 700;
    font-size: 13px;

    color: var(--muted);

    transition: all 0.25s ease;

    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
}

.day-btn:hover {
    color: var(--blue);
    border-color: #93c5fd;
    transform: translateY(-2px);
}

.day-btn.current {
    background: #ecfdf5;
    color: #15803d;
    border-color: #86efac;
}

.day-btn.active {
    color: #ffffff;

    background:
        linear-gradient(
            135deg,
            var(--blue),
            var(--purple)
        );

    border-color: transparent;

    transform: translateY(-2px) scale(1.03);

    box-shadow:
        0 7px 18px rgba(37, 99, 235, 0.22);
}

/* =========================
   LECTURE CARD
========================= */

.lecture-card {
    position: relative;
    overflow: hidden;

    background: rgba(255, 255, 255, 0.96);

    padding: 20px;

    border-radius: 16px;

    margin-bottom: 15px;

    border: 1px solid var(--border);

    border-left: 5px solid var(--blue);

    box-shadow: var(--shadow);

    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        border-color 0.25s ease;
}

.lecture-card::after {
    content: "";
    position: absolute;

    width: 120px;
    height: 120px;

    right: -60px;
    top: -60px;

    border-radius: 50%;

    background: rgba(124, 58, 237, 0.06);
}

.lecture-card:hover {
    transform: translateY(-4px);

    box-shadow: var(--shadow-hover);

    border-left-color: var(--purple);
}

/* =========================
   LECTURE HEADER
========================= */

.lecture-header {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 15px;
}

.lecture-icon {
    width: 60px;
    height: 60px;

    border-radius: 50%;

    object-fit: cover;

    border: 3px solid var(--blue);

    background: #eff6ff;

    box-shadow:
        0 5px 15px rgba(37, 99, 235, 0.15);
}

.lecture-info {
    flex: 1;
}

.lecture-title {
    font-size: 19px;
    font-weight: 800;

    color: var(--navy);

    margin-bottom: 7px;

    line-height: 1.3;
}

.lecture-time {
    display: inline-block;

    background:
        linear-gradient(
            135deg,
            var(--blue),
            var(--purple)
        );

    color: #ffffff;

    padding: 6px 13px;

    border-radius: 20px;

    font-size: 13px;
    font-weight: 700;

    box-shadow:
        0 4px 10px rgba(37, 99, 235, 0.18);
}

/* =========================
   LECTURE DETAILS
========================= */

.lecture-details {
    display: flex;
    gap: 25px;

    margin-top: 12px;

    padding-top: 13px;

    border-top: 1px solid #eef2f7;
}

.detail-item {
    display: flex;
    align-items: center;
    gap: 8px;

    color: var(--muted);

    font-size: 14px;
}

.detail-item strong {
    color: var(--text);
}

.detail-icon {
    color: var(--blue);
    font-size: 16px;
}

/* =========================
   NOTICE
========================= */

.notice {
    background:
        linear-gradient(
            135deg,
            #eff6ff,
            #f5f3ff
        );

    border-left: 5px solid var(--blue);

    padding: 15px;

    border-radius: 10px;

    margin-top: 20px;

    color: var(--muted);

    border-top: 1px solid #dbeafe;
    border-right: 1px solid #dbeafe;
    border-bottom: 1px solid #dbeafe;
}

.notice strong {
    color: var(--blue);
}

/* =========================
   HOMEWORK FORM
========================= */

.homework-form {
    background: rgba(255, 255, 255, 0.96);

    padding: 25px;

    border-radius: 16px;

    margin-bottom: 20px;

    border: 1px solid var(--border);

    box-shadow: var(--shadow);
}

.homework-form h2 {
    color: var(--navy);

    margin-bottom: 20px;

    font-size: 20px;
}

.form-group {
    margin-bottom: 14px;
}

.form-group input {
    width: 100%;

    padding: 13px 14px;

    border: 1px solid var(--border);

    border-radius: 10px;

    font-size: 14px;

    color: var(--text);

    background: #f8fafc;

    transition: all 0.25s ease;
}

.form-group input::placeholder {
    color: #94a3b8;
}

.form-group input:focus {
    outline: none;

    background: #ffffff;

    border-color: var(--blue);

    box-shadow:
        0 0 0 4px rgba(37, 99, 235, 0.1);
}

/* =========================
   ADD HOMEWORK BUTTON
========================= */

.btn-add {
    width: 100%;

    padding: 14px;

    background:
        linear-gradient(
            135deg,
            var(--blue),
            var(--purple)
        );

    color: white;

    border: none;

    border-radius: 10px;

    font-size: 15px;

    font-weight: 700;

    cursor: pointer;

    transition: all 0.25s ease;

    box-shadow:
        0 7px 18px rgba(37, 99, 235, 0.2);
}

.btn-add:hover {
    transform: translateY(-2px);

    box-shadow:
        0 11px 24px rgba(37, 99, 235, 0.28);
}

/* =========================
   HOMEWORK CARD
========================= */

.homework-card {
    background: #ffffff;

    padding: 20px;

    border-radius: 15px;

    margin-bottom: 14px;

    border: 1px solid var(--border);

    border-left: 5px solid var(--orange);

    box-shadow: var(--shadow);

    transition: all 0.25s ease;
}

.homework-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-hover);
}

.homework-card.completed {
    opacity: 0.65;
    border-left-color: var(--green);
    background: #f0fdf4;
}

.homework-card.overdue {
    background: #fff7f7;
    border-left-color: var(--red);
}

/* =========================
   HOMEWORK HEADER
========================= */

.homework-header {
    display: flex;
    align-items: flex-start;
    gap: 14px;
}

.homework-checkbox {
    width: 20px;
    height: 20px;

    cursor: pointer;

    margin-top: 5px;

    accent-color: var(--blue);
}

.homework-content {
    flex: 1;
}

.homework-subject {
    font-size: 17px;

    font-weight: 800;

    color: var(--navy);

    margin-bottom: 7px;
}

.homework-subject.completed {
    text-decoration: line-through;
    color: #94a3b8;
}

.homework-subject.overdue {
    color: var(--red);
}

.overdue-badge {
    display: inline-block;

    color: var(--red);

    background: #fee2e2;

    padding: 3px 8px;

    border-radius: 20px;

    font-size: 11px;

    margin-left: 7px;

    font-weight: 800;
}

.homework-task {
    color: var(--muted);

    margin-bottom: 10px;

    line-height: 1.5;
}

.homework-task.overdue {
    color: var(--red);
}

.homework-due {
    display: flex;
    align-items: center;

    gap: 5px;

    font-size: 13px;

    color: #94a3b8;
}

.homework-due.overdue {
    color: var(--red);
    font-weight: 700;
}

/* =========================
   DELETE BUTTON
========================= */

.btn-delete {
    background:
        linear-gradient(
            135deg,
            #ef4444,
            #dc2626
        );

    color: white;

    border: none;

    padding: 8px 12px;

    border-radius: 8px;

    cursor: pointer;

    font-weight: 700;

    transition: all 0.2s ease;
}

.btn-delete:hover {
    transform: scale(1.05);

    box-shadow:
        0 5px 12px rgba(239, 68, 68, 0.25);
}

/* =========================
   NO LECTURES
========================= */

.no-lectures {
    background: rgba(255, 255, 255, 0.95);

    padding: 45px 20px;

    text-align: center;

    border-radius: 15px;

    color: var(--muted);

    font-size: 17px;

    border: 1px solid var(--border);

    box-shadow: var(--shadow);
}

/* =========================
   MOBILE
========================= */

@media (max-width: 768px) {

    .container {
        padding: 12px;
    }

    header {
        padding: 25px 15px;
        border-radius: 16px;
    }

    header h1 {
        font-size: 1.35rem;
    }

    header p {
        font-size: 13px;
    }

    .tabs {
        gap: 8px;
    }

    .tab-btn {
        padding: 12px 8px;
        font-size: 13px;
    }

    .current-date {
        flex-direction: column;
        align-items: flex-start;
        gap: 7px;
    }

    .day-selector {
        justify-content: flex-start;

        overflow-x: auto;

        flex-wrap: nowrap;

        padding-bottom: 5px;

        scrollbar-width: none;
    }

    .day-selector::-webkit-scrollbar {
        display: none;
    }

    .day-btn {
        flex-shrink: 0;
        padding: 10px 16px;
    }

    .lecture-card {
        padding: 16px;
    }

    .lecture-header {
        gap: 12px;
    }

    .lecture-icon {
        width: 52px;
        height: 52px;
    }

    .lecture-title {
        font-size: 16px;
    }

    .lecture-time {
        font-size: 12px;
        padding: 5px 10px;
    }

    .lecture-details {
        flex-direction: column;
        gap: 9px;
    }

    .homework-form {
        padding: 18px;
    }

    .homework-header {
        gap: 10px;
    }

    .homework-subject {
        font-size: 16px;
    }

    .overdue-badge {
        margin-left: 0;
        margin-top: 5px;
    }
}

/* =========================
   SMALL PHONES
========================= */

@media (max-width: 400px) {

    .container {
        padding: 8px;
    }

    header {
        padding: 22px 10px;
    }

    header h1 {
        font-size: 1.15rem;
    }

    .lecture-header {
        align-items: flex-start;
    }

    .lecture-icon {
        width: 46px;
        height: 46px;
    }

    .lecture-title {
        font-size: 15px;
    }

    .homework-header {
        align-items: flex-start;
    }

    .btn-delete {
        padding: 7px 10px;
    }
}

  { time: '11:25-12:20', subject: 'EEM 303 Data structure ', teacher: 'Atul Dayal sir ', room: 'R7', image: 'https://via.placeholder.com/80/D35400/ffffff?text=TK' },
  { time: '12:20-1:15', subject: 'MAM 381', teacher: 'Mohit katara', room: 'AH', image: 'https://via.placeholder.com/80/F39C12/ffffff?text=MAM' }
  ],
  SUN: []
  };
        // Homework Data - Load from localStorage
        let homeworkList = JSON.parse(localStorage.getItem('homeworkList')) || [
            { id: 1, subject: 'PHM 281', task: 'Complete Chapter 5 Problems', dueDate: '2025-12-30', completed: false },
            { id: 2, subject: 'EEM 201 C Language', task: 'Lab Report Submission', dueDate: '2025-12-26', completed: false },
            { id: 3, subject: 'MAM 281 Eng. Mathematics', task: 'Assignment 2', dueDate: '2025-12-28', completed: false }
        ];
        
        // Save homework to localStorage
        function saveHomework() {
            localStorage.setItem('homeworkList', JSON.stringify(homeworkList));
        }
        
        // Get current day
        function getCurrentDay() {
            const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
            return days[new Date().getDay()];
        }
        
        // Initialize
        let selectedDay = getCurrentDay();
        
        function init() {
            const today = getCurrentDay();
            document.getElementById('currentDay').textContent = today;
            
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('currentDate').textContent = new Date().toLocaleDateString('en-IN', options);
            
            // Mark current day button
            document.querySelectorAll('.day-btn').forEach(btn => {
                const day = btn.textContent.trim();
                if (day === today) {
                    btn.classList.add('current');
                }
                if (day === selectedDay) {
                    btn.classList.add('active');
                }
            });
            
            displayLectures();
            displayHomework();
        }
        
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }
        
        function selectDay(day) {
            selectedDay = day;
            document.querySelectorAll('.day-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent.trim() === day) {
                    btn.classList.add('active');
                }
            });
            displayLectures();
        }
        
        function displayLectures() {
            const container = document.getElementById('lecturesContainer');
            const lectures = timetable[selectedDay];
            
            if (!lectures || lectures.length === 0) {
                container.innerHTML = '<div class="no-lectures">😊 No classes today! Enjoy your day!</div>';
                return;
            }
            
            container.innerHTML = lectures.map(lecture => `
                <div class="lecture-card">
                    <div class="lecture-header">
                        <img src="${lecture.image}" alt="${lecture.teacher}" class="lecture-icon" onerror="this.src='https://via.placeholder.com/80/667eea/ffffff?text=${lecture.teacher.charAt(0)}'">
                        <div class="lecture-info">
                            <div class="lecture-title">${lecture.subject}</div>
                            <span class="lecture-time">🕐 ${lecture.time}</span>
                        </div>
                    </div>
                    <div class="lecture-details">
                        <div class="detail-item">
                            <span class="detail-icon">👤</span>
                            <strong>${lecture.teacher}</strong>
                        </div>
                        <div class="detail-item">
                            <span class="detail-icon">📍</span>
                            ${lecture.room}
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        function addHomework() {
            const subject = document.getElementById('hwSubject').value.trim();
            const task = document.getElementById('hwTask').value.trim();
            const dueDate = document.getElementById('hwDueDate').value;
            
            if (!subject || !task || !dueDate) {
                alert('Please fill all fields!');
                return;
            }
            
            homeworkList.push({
                id: Date.now(),
                subject: subject,
                task: task,
                dueDate: dueDate,
                completed: false
            });
            
            saveHomework(); // Save to localStorage
            
            document.getElementById('hwSubject').value = '';
            document.getElementById('hwTask').value = '';
            document.getElementById('hwDueDate').value = '';
            
            displayHomework();
        }
        
        function toggleHomework(id) {
            const hw = homeworkList.find(h => h.id === id);
            if (hw) {
                hw.completed = !hw.completed;
                saveHomework(); // Save to localStorage
                displayHomework();
            }
        }
        
        function deleteHomework(id) {
            homeworkList = homeworkList.filter(h => h.id !== id);
            saveHomework(); // Save to localStorage
            displayHomework();
        }
        
        function isOverdue(dueDate) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const due = new Date(dueDate);
            due.setHours(0, 0, 0, 0);
            return due < today;
        }
        
        function displayHomework() {
            const container = document.getElementById('homeworkContainer');
            
            // Sort homework
            const sorted = [...homeworkList].sort((a, b) => {
                if (a.completed && !b.completed) return 1;
                if (!a.completed && b.completed) return -1;
                return new Date(a.dueDate) - new Date(b.dueDate);
            });
            
            if (sorted.length === 0) {
                container.innerHTML = '<div class="no-lectures">📝 No homework yet. Add some above!</div>';
                return;
            }
            
            container.innerHTML = sorted.map(hw => {
                const overdue = !hw.completed && isOverdue(hw.dueDate);
                const cardClass = hw.completed ? 'completed' : (overdue ? 'overdue' : '');
                const subjectClass = hw.completed ? 'completed' : (overdue ? 'overdue' : '');
                const taskClass = overdue ? 'overdue' : '';
                const dueClass = overdue ? 'overdue' : '';
                
                return `
                    <div class="homework-card ${cardClass}">
                        <div class="homework-header">
                            <input type="checkbox" class="homework-checkbox" 
                                   ${hw.completed ? 'checked' : ''} 
                                   onchange="toggleHomework(${hw.id})">
                            <div class="homework-content">
                                <div class="homework-subject ${subjectClass}">
                                    ${hw.subject}
                                    ${overdue ? '<span class="overdue-badge">⚠️ OVERDUE!</span>' : ''}
                                </div>
                                <div class="homework-task ${taskClass}">${hw.task}</div>
                                <div class="homework-due ${dueClass}">
                                    🕐 Due: ${new Date(hw.dueDate).toLocaleDateString('en-IN')}
                                </div>
                            </div>
                            <button class="btn-delete" onclick="deleteHomework(${hw.id})">✕</button>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        // Initialize on load
        init();
    </script>
</body>

</html>
